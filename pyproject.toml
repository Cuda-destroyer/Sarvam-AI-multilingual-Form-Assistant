[project]
name = "sarvam-multilingual-form-filler"
version = "0.1.0"
description = "Sarvam AI-Powered Multilingual Form and Document Filling Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0,<1.61.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2.0",
    "pillow>=10.0.0,<13.0.0",
    "python-dateutil>=2.9.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']
